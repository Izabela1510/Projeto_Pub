<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Pipeline Exoma</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0e1a;
      --surface: #111827;
      --border: #1e293b;
      --accent: #22d3ee;
      --accent2: #818cf8;
      --text: #f1f5f9;
      --muted: #64748b;
      --error: #f87171;
      --success: #34d399;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Fundo animado com partículas de DNA */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(34,211,238,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34,211,238,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.18;
      pointer-events: none;
      animation: drift 12s ease-in-out infinite alternate;
    }
    .blob-1 { width: 400px; height: 400px; background: var(--accent); top: -100px; left: -100px; animation-delay: 0s; }
    .blob-2 { width: 300px; height: 300px; background: var(--accent2); bottom: -80px; right: -80px; animation-delay: -4s; }
    .blob-3 { width: 200px; height: 200px; background: #34d399; bottom: 30%; left: 10%; animation-delay: -8s; }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(30px, 20px) scale(1.08); }
    }

    /* Card */
    .card {
      position: relative;
      z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 0 60px rgba(34,211,238,0.08), 0 20px 60px rgba(0,0,0,0.5);
      animation: slideUp 0.6s cubic-bezier(0.16,1,0.3,1) both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }

    .logo-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }

    .logo-text {
      font-size: 14px;
      font-family: 'Space Mono', monospace;
      color: var(--muted);
      line-height: 1.3;
    }
    .logo-text strong { color: var(--text); font-size: 16px; display: block; }

    h1 {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 8px;
    }
    h1 span { color: var(--accent); }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 32px;
      font-family: 'Space Mono', monospace;
    }

    /* Tabs */
    .tabs {
      display: flex;
      background: var(--bg);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 28px;
      border: 1px solid var(--border);
    }

    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      border-radius: 7px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      transition: all 0.25s;
      border: none;
      background: transparent;
    }

    .tab.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    /* Inputs */
    .field { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
      font-family: 'Space Mono', monospace;
    }

    input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      color: var(--text);
      font-size: 15px;
      font-family: 'Syne', sans-serif;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(34,211,238,0.12);
    }

    /* Botão */
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #0a0e1a;
      font-size: 15px;
      font-weight: 800;
      font-family: 'Syne', sans-serif;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s, transform 0.15s;
      letter-spacing: 0.02em;
    }

    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* Mensagem de erro/sucesso */
    .msg {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-family: 'Space Mono', monospace;
      display: none;
    }
    .msg.erro { background: rgba(248,113,113,0.12); border: 1px solid rgba(248,113,113,0.3); color: var(--error); display: block; }
    .msg.sucesso { background: rgba(52,211,153,0.12); border: 1px solid rgba(52,211,153,0.3); color: var(--success); display: block; }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(10,14,26,0.3);
      border-top-color: #0a0e1a;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .form-section { display: none; }
    .form-section.active { display: block; }
  </style>
</head>
<body>

<div class="bg-grid"></div>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>



  <h1>Bem-vindo ao <span>curso</span></h1>
  <p class="subtitle">// faça login ou crie sua conta</p>

  <div class="tabs">
    <button class="tab active" onclick="trocarAba('login')">Entrar</button>
    <button class="tab" onclick="trocarAba('cadastro')">Cadastrar</button>
  </div>

  <!-- LOGIN -->
  <div class="form-section active" id="form-login">
    <div class="field">
      <label>E-mail</label>
      <input type="email" id="login-email" placeholder="seu@email.com" />
    </div>
    <div class="field">
      <label>Senha</label>
      <input type="password" id="login-senha" placeholder="••••••••" />
    </div>
    <button class="btn" id="btn-login" onclick="fazerLogin()">Entrar no curso</button>
  </div>

  <!-- CADASTRO -->
  <div class="form-section" id="form-cadastro">
    <div class="field">
      <label>Nome completo</label>
      <input type="text" id="cad-nome" placeholder="Seu nome" />
    </div>
    <div class="field">
      <label>E-mail</label>
      <input type="email" id="cad-email" placeholder="seu@email.com" />
    </div>
    <div class="field">
      <label>Senha</label>
      <input type="password" id="cad-senha" placeholder="Mínimo 6 caracteres" />
    </div>
    <button class="btn" id="btn-cadastro" onclick="fazerCadastro()">Criar conta</button>
  </div>

  <div class="msg" id="mensagem"></div>
</div>

<!-- ===================== FIREBASE ===================== -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    updateProfile
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import {
    getFirestore,
    doc,
    setDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // ⚠️ SUBSTITUA pelos dados do SEU projeto Firebase
  const firebaseConfig = {
    apiKey: "COLE_SUA_API_KEY_AQUI",
    authDomain: "COLE_SEU_AUTH_DOMAIN_AQUI",
    projectId: "COLE_SEU_PROJECT_ID_AQUI",
    storageBucket: "COLE_SEU_STORAGE_BUCKET_AQUI",
    messagingSenderId: "COLE_SEU_MESSAGING_SENDER_ID_AQUI",
    appId: "COLE_SEU_APP_ID_AQUI"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Expõe funções globalmente
  window.fazerLogin = async function () {
    const email = document.getElementById("login-email").value.trim();
    const senha = document.getElementById("login-senha").value;
    const btn = document.getElementById("btn-login");

    if (!email || !senha) { mostrarMensagem("Preencha todos os campos.", "erro"); return; }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Entrando...';

    try {
      await signInWithEmailAndPassword(auth, email, senha);
      mostrarMensagem("Login realizado! Redirecionando...", "sucesso");
      setTimeout(() => window.location.href = "desenvolvimento.html", 1200);
    } catch (err) {
      btn.disabled = false;
      btn.innerHTML = "Entrar no curso";
      mostrarMensagem(traduzirErro(err.code), "erro");
    }
  };

  window.fazerCadastro = async function () {
    const nome  = document.getElementById("cad-nome").value.trim();
    const email = document.getElementById("cad-email").value.trim();
    const senha = document.getElementById("cad-senha").value;
    const btn   = document.getElementById("btn-cadastro");

    if (!nome || !email || !senha) { mostrarMensagem("Preencha todos os campos.", "erro"); return; }
    if (senha.length < 6) { mostrarMensagem("A senha precisa ter no mínimo 6 caracteres.", "erro"); return; }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Criando conta...';

    try {
      const cred = await createUserWithEmailAndPassword(auth, email, senha);
      await updateProfile(cred.user, { displayName: nome });

      // Cria documento de progresso zerado no Firestore
      await setDoc(doc(db, "progresso", cred.user.uid), {
        nome: nome,
        email: email,
        criadoEm: serverTimestamp(),
        etapas: {
          problema: false,
          literatura: false,
          fastq: false,
          qc: false,
          trimagem: false,
          alinhamento: false,
          boas_praticas: false,
          variantes: false,
          anotacao: false,
          analise: false
        }
      });

      mostrarMensagem("Conta criada com sucesso! Redirecionando...", "sucesso");
      setTimeout(() => window.location.href = "desenvolvimento.html", 1200);
    } catch (err) {
      btn.disabled = false;
      btn.innerHTML = "Criar conta";
      mostrarMensagem(traduzirErro(err.code), "erro");
    }
  };

  function traduzirErro(code) {
    const erros = {
      "auth/email-already-in-use": "Este e-mail já está cadastrado.",
      "auth/invalid-email": "E-mail inválido.",
      "auth/wrong-password": "Senha incorreta.",
      "auth/user-not-found": "Usuário não encontrado.",
      "auth/weak-password": "Senha muito fraca.",
      "auth/invalid-credential": "E-mail ou senha incorretos.",
      "auth/too-many-requests": "Muitas tentativas. Tente novamente mais tarde.",
    };
    return erros[code] || "Ocorreu um erro. Tente novamente.";
  }

  function mostrarMensagem(texto, tipo) {
    const el = document.getElementById("mensagem");
    el.textContent = texto;
    el.className = "msg " + tipo;
  }
</script>

<script>
  function trocarAba(aba) {
    document.querySelectorAll(".tab").forEach((t, i) => {
      t.classList.toggle("active", (i === 0 && aba === "login") || (i === 1 && aba === "cadastro"));
    });
    document.getElementById("form-login").classList.toggle("active", aba === "login");
    document.getElementById("form-cadastro").classList.toggle("active", aba === "cadastro");
    document.getElementById("mensagem").className = "msg";
  }

  // Envia com Enter
  document.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      const abaAtiva = document.querySelector(".form-section.active").id;
      if (abaAtiva === "form-login") window.fazerLogin?.();
      else window.fazerCadastro?.();
    }
  });
</script>
</body>
</html>

    const email = document.getElementById("login-email").value.trim();
    const senha = document.getElementById("login-senha").value;
    const btn = document.getElementById("btn-login");

    if (!email || !senha) { mostrarMensagem("Preencha todos os campos.", "erro"); return; }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Entrando...';

    try {
      await signInWithEmailAndPassword(auth, email, senha);
      mostrarMensagem("Login realizado! Redirecionando...", "sucesso");
      setTimeout(() => window.location.href = "desenvolvimento.html", 1200);
    } catch (err) {
      btn.disabled = false;
      btn.innerHTML = "Entrar no curso";
      mostrarMensagem(traduzirErro(err.code), "erro");
    }
  };

  window.fazerCadastro = async function () {
    const nome  = document.getElementById("cad-nome").value.trim();
    const email = document.getElementById("cad-email").value.trim();
    const senha = document.getElementById("cad-senha").value;
    const btn   = document.getElementById("btn-cadastro");

    if (!nome || !email || !senha) { mostrarMensagem("Preencha todos os campos.", "erro"); return; }
    if (senha.length < 6) { mostrarMensagem("A senha precisa ter no mínimo 6 caracteres.", "erro"); return; }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Criando conta...';

    try {
      const cred = await createUserWithEmailAndPassword(auth, email, senha);
      await updateProfile(cred.user, { displayName: nome });

      // Cria documento de progresso zerado no Firestore
      await setDoc(doc(db, "progresso", cred.user.uid), {
        nome: nome,
        email: email,
        criadoEm: serverTimestamp(),
        etapas: {
          problema: false,
          literatura: false,
          fastq: false,
          qc: false,
          trimagem: false,
          alinhamento: false,
          boas_praticas: false,
          variantes: false,
          anotacao: false,
          analise: false
        }
      });

      mostrarMensagem("Conta criada com sucesso! Redirecionando...", "sucesso");
      setTimeout(() => window.location.href = "desenvolvimento.html", 1200);
    } catch (err) {
      btn.disabled = false;
      btn.innerHTML = "Criar conta";
      mostrarMensagem(traduzirErro(err.code), "erro");
    }
  };

  function traduzirErro(code) {
    const erros = {
      "auth/email-already-in-use": "Este e-mail já está cadastrado.",
      "auth/invalid-email": "E-mail inválido.",
      "auth/wrong-password": "Senha incorreta.",
      "auth/user-not-found": "Usuário não encontrado.",
      "auth/weak-password": "Senha muito fraca.",
      "auth/invalid-credential": "E-mail ou senha incorretos.",
      "auth/too-many-requests": "Muitas tentativas. Tente novamente mais tarde.",
    };
    return erros[code] || "Ocorreu um erro. Tente novamente.";
  }

  function mostrarMensagem(texto, tipo) {
    const el = document.getElementById("mensagem");
    el.textContent = texto;
    el.className = "msg " + tipo;
  }
</script>

<script>
  function trocarAba(aba) {
    document.querySelectorAll(".tab").forEach((t, i) => {
      t.classList.toggle("active", (i === 0 && aba === "login") || (i === 1 && aba === "cadastro"));
    });
    document.getElementById("form-login").classList.toggle("active", aba === "login");
    document.getElementById("form-cadastro").classList.toggle("active", aba === "cadastro");
    document.getElementById("mensagem").className = "msg";
  }

  // Envia com Enter
  document.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      const abaAtiva = document.querySelector(".form-section.active").id;
      if (abaAtiva === "form-login") window.fazerLogin?.();
      else window.fazerCadastro?.();
    }
  });
</script>
</body>
</html>
