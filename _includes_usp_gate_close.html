<script>
// ── USP OAuth ──────────────────────────────────────────────────
// Em produção substitua loginUSP() por:
//   window.location.href = 'https://uspdigital.usp.br/wsusuario/oauthautorizacao'
//     + '?redirect_uri=' + encodeURIComponent(location.href)
//     + '&response_type=code&client_id=SEU_CLIENT_ID';
//
// O callback do backend salva o usuário em localStorage depois
// de trocar o code pelo token com a USP.

function loginUSP() {
  // SIMULAÇÃO — remova em produção e use o redirect acima
  const user = { nome: 'Usuário USP', email: 'usuario@usp.br', numeroUsp: '00000000' };
  localStorage.setItem('pub_user', JSON.stringify(user));
  mostrarConteudo();
}

function logoutUSP() {
  localStorage.removeItem('pub_user');
  location.reload();
}

function mostrarConteudo() {
  const user = JSON.parse(localStorage.getItem('pub_user') || 'null');
  const gate = document.getElementById('usp-gate');
  const cont = document.getElementById('conteudo-protegido');
  const bar  = document.getElementById('usp-user-bar');
  if (user && gate && cont) {
    gate.style.display = 'none';
    cont.style.display = 'block';
    if (bar) {
      bar.style.display = 'flex';
      document.getElementById('usp-user-nome').textContent  = user.nome;
      document.getElementById('usp-user-email').textContent = user.email;
    }
  }
}

mostrarConteudo();
</script>
